name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vehicle
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: vehicle_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vehicle -d vehicle_api_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vehicle:ci-password@localhost:5432/vehicle_api_test?schema=public
      TEST_DATABASE_URL: postgresql://vehicle:ci-password@localhost:5432/vehicle_api_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx oxlint --type-aware src/ test/ scripts/ prisma/
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
